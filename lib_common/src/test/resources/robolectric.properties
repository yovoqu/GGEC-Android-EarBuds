# Robolectric 运行期 SDK 选择。
#
# 模块 targetSdk 为 37，而 Robolectric 4.14.1 支持到 35；不钉住时无 @Config(sdk=...) 的用例
# 会以 IllegalArgumentException "Package targetSdkVersion=37 > maxSdkVersion=35" 初始化失败。
# 这里统一钉到本机已缓存的最高受支持版本（Android 15 / API 35），
# 单个用例仍可用 @Config(sdk = ...) 覆盖（如 FileCoreAccessGateTest 用 29）。
sdk=35
