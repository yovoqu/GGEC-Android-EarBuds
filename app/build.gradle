plugins {
    id 'com.android.application'
}

// APK 文件名前缀：应用名（去掉空格与非法字符），与 res/values/strings.xml 的 app_name 一致。
def appDisplayName = 'GGEC_EarBuds'

android {
    namespace = 'com.ggec.earbuds'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.ggec.earbuds'
        minSdk = 29
        targetSdk {
            version = release(37)
        }

        versionCode = 3
        versionName = '1.0.2'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/keystore/release.jks")
            keyAlias 'ggec'
            keyPassword 'ggec123456'
            storePassword 'ggec123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding = true
    }
}

// APK 产物命名：应用名_版本名_构建类型.apk，例如 GGEC_EarBuds_1.0.1_Release.apk / ..._Debug.apk。
androidComponents {
    onVariants(selector().all()) { variant ->
        def buildType = variant.buildType
        variant.outputs.forEach { output ->
            def versionName = output.versionName.orNull ?: android.defaultConfig.versionName
            output.outputFileName.set("${appDisplayName}_${versionName}_${buildType}.apk")
        }
    }
}

dependencies {
    implementation project(':lib_common')
    implementation project(':lib_ai')
    implementation project(':biz_appupdate')
    implementation project(':biz_ggec_hs')
    implementation project(':biz_ggec_wy')
    implementation project(':biz_ggec_record')

    implementation files('libs/youi_kit-1.0.0.aar')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // android.jar 里的 org.json 是抛异常的桩，数据层的 JSON 编解码测试需要真实实现。
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// ---------------------------------------------------------------------------
// 边界门禁（docs/architecture/2026-11-app-rebuild/architecture-rules.md §2.5）
//
// 全部按「目录 + 包名前缀」判定，没有文件名/类名白名单：
//   - 依赖模块清单从 implementation 的 ProjectDependency 派生，不手写名单；
//   - provider 第一级目录名 == 依赖模块名（`provider/<module>/<职责子目录>/` 的子目录由
//     architecture-rules §2.1 约定，门禁只看第一级目录，所以新增职责子目录不需要改门禁）；
//   - provider 只允许 import 该依赖的公开包，且不得进 internal/impl；
//   - provider 只实现 domain 端口：不得 import ui/data/platform，也不得 import domain 用例；
//   - 非 provider 代码不得 import 任何业务依赖；
//   - 基线原语（lib_common 声明的类型）不得在其它包里出现同名类型；
//     唯一的冻结根是 record/**（第二个产品入口，本轮隔离、待独立模块化），以目录声明。
// ---------------------------------------------------------------------------

def appRelativePath = { File file ->
    rootProject.relativePath(file).replace('\\', '/')
}

// 目录即事实：包前缀由 Gradle 模块名派生（com.yovo.<projectName>）。
def dependencyModules = providers.provider {
    configurations.implementation.dependencies
            .findAll { it instanceof ProjectDependency }
            .collect { it.name }
            .sort()
}
def dependencyPackagePrefixes = providers.provider {
    dependencyModules.get().collectEntries { String name -> [(name): "com.yovo.${name}"] }
}

// 已无搁置目录：record 入口并入 provider(biz_ggec_record)+domain(record)+wiring 分层，
// 全量纳入本门禁扫描（Wave 2：删除原 record/ 豁免）。
def untouchedFeatureRoots = []
// 平台基线：共享 UI 原语等价于 androidx，仅 ui/** 可用。
def platformBaselinePackages = ['com.yovo.lib_common.event']

def javaMainTree = { String relativeDir ->
    fileTree(project.file(relativeDir)) { include '**/*.java' }
}

def eachJavaLine = { File file, Closure action ->
    file.eachLine { line, index -> action.call(file, line, index + 1) }
}

// 包声明是结构事实：门禁按包名判定，不按文件名/类名。
def declaredPackageOf = { File file ->
    String found = ''
    file.eachLine { line ->
        if (found.isEmpty()) {
            def matcher = line =~ /^\s*package\s+([\w.]+)\s*;/
            if (matcher.find()) {
                found = matcher.group(1)
            }
        }
    }
    return found
}

// 顶层类型声明（缩进为 0）：内部类不算「另一份基线原语」。
def declaredTopLevelType = ~/^(?:public\s+|protected\s+|private\s+|abstract\s+|final\s+|sealed\s+|non-sealed\s+|static\s+|strictfp\s+)*(?:class|interface|enum|record)\s+(\w+)/

// 基线真源：lib_common 里每个顶层类型都是基线类型；返回 类型名 -> "包名|路径"。
def collectBaselineTypes = { String relativeDir ->
    Map<String, String> found = [:]
    def root = project.file(relativeDir)
    if (!root.exists()) {
        return found
    }
    fileTree(root) { include '**/*.java' }.each { File file ->
        String rel = rootProject.relativePath(file).replace('\\', '/')
        String packageName = declaredPackageOf.call(file)
        file.eachLine { line ->
            def matcher = line =~ declaredTopLevelType
            if (matcher.find() && !found.containsKey(matcher.group(1))) {
                found.put(matcher.group(1), "${packageName}|${rel}".toString())
            }
        }
    }
    return found
}

tasks.register('checkAppDependencyBoundary') {
    group = 'verification'
    description = 'src/main only: provider/<module> is the single import point; provider imports stay inside its dependency public API.'
    doLast {
        Map<String, String> prefixes = dependencyPackagePrefixes.get()
        List<String> modules = dependencyModules.get()
        def offenders = []
        javaMainTree('src/main/java').each { File file ->
            def rel = appRelativePath(file)
            def marker = '/provider/'
            int index = rel.indexOf(marker)
            String providerModule = index < 0 ? null
                    : rel.substring(index + marker.length()).split('/')[0]
            boolean untouched = untouchedFeatureRoots.any { rel.contains(it) }
            eachJavaLine(file) { f, line, number ->
                if (untouched) {
                    return
                }
                def matcher = line =~ /^\s*import\s+(?:static\s+)?(com\.yovo\.[\w.]+);/
                if (!matcher.find()) {
                    return
                }
                String imported = matcher.group(1)
                if (providerModule == null) {
                    if (rel.contains('/ui/') && platformBaselinePackages.any { imported.startsWith(it + '.') }) {
                        return
                    }
                    String module = modules.find { imported.startsWith(prefixes[it] + '.') }
                    if (module != null) {
                        offenders << "${rel}:${number}: 业务依赖只能经 provider 接入 -> ${line.trim()}"
                    }
                    return
                }
                if (!imported.startsWith("com.yovo.${providerModule}.")) {
                    offenders << "${rel}:${number}: provider/${providerModule} 只能 import com.yovo.${providerModule}.* -> ${line.trim()}"
                }
                if (imported.contains('.internal.') || imported.endsWith('.internal')
                        || imported.contains('.impl.')) {
                    offenders << "${rel}:${number}: provider 不得引用依赖内部实现 -> ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('App 依赖边界：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkAppLayering') {
    group = 'verification'
    description = 'src/main only: ui/data/domain do not reach provider; provider is referenced only from wiring; provider only implements domain ports; VM owns no views or platform handles.'
    doLast {
        def offenders = []
        // provider 是「本应用端口 ↔ 第三方依赖」的适配层：只实现 domain 端口、只用 domain 模型，
        // 不得反向 import 上层实现（ui/data/platform）。历史违规：provider/biz_appupdate 曾
        // import ui.update.* 并自己 startActivity；现在端口在 domain/update/port，系统页面动作由
        // platform/update 实现、wiring 注入，provider 只做翻译。
        def providerForbiddenImports = ['com.ggec.earbuds.ui.', 'com.ggec.earbuds.data.',
                                        'com.ggec.earbuds.platform.']
        javaMainTree('src/main/java').each { File file ->
            def rel = appRelativePath(file)
            boolean untouched = untouchedFeatureRoots.any { rel.contains(it) }
            boolean viewModel = file.name.endsWith('ViewModel.java')
            eachJavaLine(file) { f, line, number ->
                def matcher = line =~ /^\s*import\s+(?:static\s+)?([\w.]+);/
                if (!matcher.find()) {
                    return
                }
                String imported = matcher.group(1)
                def at = { String message -> offenders << "${rel}:${number}: ${message}" }
                if (untouched) {
                    return
                }
                if (imported.startsWith('com.ggec.earbuds.provider.')
                        && !rel.contains('/wiring/') && !rel.contains('/provider/')) {
                    at('provider.** 只允许装配根 wiring/** 引用')
                }
                if (rel.contains('/provider/')) {
                    providerForbiddenImports.each { String prefix ->
                        if (imported.startsWith(prefix)) {
                            at("provider 不得 import ${prefix}**：适配层只实现 domain 端口，宿主实现由 wiring 注入")
                        }
                    }
                    if (imported =~ /^com\.ggec\.earbuds\.domain\.[\w.]*\.usecase\./) {
                        at('provider 不得 import domain 用例：适配层只实现端口、只用模型')
                    }
                }
                if (rel.contains('/ui/') && imported.startsWith('com.ggec.earbuds.data.')) {
                    at('ui 不得 import data.**')
                }
                if (rel.contains('/ui/')) {
                    if (imported.startsWith('java.io.') || imported.startsWith('java.nio.file.')
                            || imported.startsWith('org.json.')) {
                        at('ui 不得直接做文件/JSON IO')
                    }
                }
                if (rel.contains('/data/')) {
                    if (imported.startsWith('android.')
                            || (imported.startsWith('androidx.') && !imported.startsWith('androidx.annotation.'))) {
                        at('data 不得 import Android 运行时')
                    }
                    if (imported == 'com.ggec.earbuds.ui' || imported.startsWith('com.ggec.earbuds.ui.')) {
                        at('data 不得 import ui.**')
                    }
                }
                if (rel.contains('/domain/')) {
                    if (imported.startsWith('android.') || imported.startsWith('com.ggec.earbuds.data.')
                            || imported.startsWith('com.ggec.earbuds.ui.')
                            || imported.startsWith('com.ggec.earbuds.platform.')
                            || imported.startsWith('com.ggec.earbuds.wiring.')
                            || imported.startsWith('org.json.')) {
                        at('domain 必须是纯 Java，不依赖框架/邻层')
                    }
                    if (imported.startsWith('com.ggec.earbuds.data.store.')) {
                        at('domain 不得 import IO 原语（data.store）')
                    }
                }
                if (viewModel) {
                    if (imported =~ /^android\.(view|widget|content|app|os\.(Handler|Looper))\.?/) {
                        at('ViewModel 不得 import Android UI/Looper')
                    }
                    if (imported.startsWith('com.yohu.youi.') || imported.startsWith('com.ggec.earbuds.wiring.')) {
                        at('ViewModel 不得 import 组件库或装配根')
                    }
                    if (imported =~ /^com\.ggec\.earbuds\.domain\.[\w.]*\.port\.\w*Repository$/) {
                        at('ViewModel 只能经用例触达仓库端口')
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('分层越界：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkAiLayerImports') {
    group = 'verification'
    description = 'Fail if the AI feature crosses its layer boundaries.'
    doLast {
        def offenders = []
        def scanTree = { String relativeDir, List<String> forbidden ->
            fileTree(project.file("src/main/java/com/ggec/earbuds/${relativeDir}")) {
                include '**/*.java'
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    forbidden.each { token ->
                        if (line.contains(token)) {
                            offenders << "${rel}:${index + 1}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        scanTree('domain/ai', ['com.yovo.lib_ai', 'org.json', 'com.ggec.earbuds.platform',
                               'com.ggec.earbuds.wiring', 'com.ggec.earbuds.data', 'com.ggec.earbuds.ui'])
        scanTree('data/ai', ['com.ggec.earbuds.ui', 'com.ggec.earbuds.platform',
                             'com.ggec.earbuds.wiring', 'com.yovo.lib_ai.internal',
                             'com.yovo.lib_ai.platform.openai', 'com.yovo.lib_ai.platform.qwen',
                             'com.yovo.lib_ai.platform.anthropic', 'com.yovo.lib_ai.platform.deepseek',
                             'com.yovo.lib_ai.platform.sensenova', 'com.ggec.earbuds.domain.ai.policy'])
        scanTree('ui/ai', ['com.yovo.lib_ai', 'org.json', 'com.ggec.earbuds.platform',
                           'com.ggec.earbuds.data'])
        scanTree('ui/ai', ['com.ggec.earbuds.domain.ai.port.AiSettingsRepository',
                           'com.ggec.earbuds.domain.ai.port.AiConversationRepository',
                           'com.ggec.earbuds.domain.ai.port.AiChatGateway',
                           'com.ggec.earbuds.domain.ai.port.AiModelGateway',
                           'com.ggec.earbuds.domain.ai.port.AiSpeedTestGateway',
                           'com.ggec.earbuds.domain.ai.port.AiPlatformCatalog'])
        if (!offenders.isEmpty()) {
            throw new GradleException('AI 分层越界：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkComponentOwnership') {
    group = 'verification'
    description = 'Fail if page code destroys YoUI components outside a release scope or uses framework dialogs.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                def trimmed = line.trim()
                if ((trimmed.contains('YoList') || trimmed.contains('YoSelect')
                        || trimmed.contains('YoMenu') || trimmed.contains('YoDialog'))
                        && trimmed.matches('.*\\.destroy\\(\\);.*')) {
                    offenders << "${rel}:${index + 1}: ${trimmed}"
                }
                if (trimmed.contains('androidx.appcompat.app.AlertDialog')) {
                    offenders << "${rel}:${index + 1}: ${trimmed}"
                }
                if (trimmed.contains('::destroy')
                        && !trimmed.contains('own(') && !trimmed.contains('releases.add(')) {
                    offenders << "${rel}:${index + 1}: ${trimmed}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('YoUI 组件只能经 YoComponents 释放，弹窗只用 YoDialog/YoMenu：\n'
                    + offenders.join('\n'))
        }
    }
}

tasks.register('checkExplicitImports') {
    group = 'verification'
    description = 'Fail if a Java file uses a wildcard import.'
    doLast {
        def offenders = []
        ['src/main/java', 'src/test/java', 'src/androidTest/java'].each { String dir ->
            def root = project.file(dir)
            if (!root.exists()) {
                return
            }
            fileTree(root) {
                include '**/*.java'
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    if (line.trim().matches('import\\s+(static\\s+)?[\\w.]+\\.\\*;')) {
                        offenders << "${rel}:${index + 1}: ${line.trim()}"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('禁止通配 import：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkFrameworkToastForbidden') {
    group = 'verification'
    description = 'Fail if any Java code uses android.widget.Toast instead of YoUI YoToast.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                if (line.contains('android.widget.Toast')) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('禁止直接使用 android.widget.Toast，改用 YoToast：\n'
                    + offenders.join('\n'))
        }
    }
}

tasks.register('checkSingleYoLogInit') {
    group = 'verification'
    description = 'YoLog.init may only be called from the log foundation package.'
    doLast {
        def offenders = []
        fileTree(project.rootDir) {
            include '**/*.java'
            exclude '**/build/**'
            exclude '**/.gradle/**'
            exclude '**/src/test/**'
            exclude '**/src/androidTest/**'
        }.each { file ->
            def rel = project.rootDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            // 唯一落点由包结构决定：日志基础包本身；包外（不论文件叫什么）一律不许调 init。
            if (declaredPackageOf.call(file) == 'com.yovo.lib_common.log') {
                return
            }
            file.eachLine { line, index ->
                if (line =~ /\bYoLog\s*\.\s*init\s*\(/) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('YoLog.init 只能由 com.yovo.lib_common.log 包内部调用：\n'
                    + offenders.join('\n'))
        }
    }
}

tasks.register('checkAppMvvmLayers') {
    group = 'verification'
    description = 'Strict MVVM layering: domain is pure Java; ui owns no persistence; data owns no UI.'
    doLast {
        def offenders = []
        def rel = { File f -> project.rootDir.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/ViewModel.java'
            include '**/*ViewModel.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+android\.(view|widget|content|app)\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            }
            if (l =~ /^\s*import\s+android\.os\.(Handler|Looper)\s*;/) {
                offenders << "${rel(f)}:${i + 1}: VM 不得自建 Handler/Looper：${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/domain')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+(android\.|com\.ggec\.earbuds\.(data|ui|platform|wiring)\.)/) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+com\.ggec\.earbuds\.data\./) {
                offenders << "${rel(f)}:${i + 1}: ui 不得 import data：${l.trim()}"
            } } }
        if (!offenders.isEmpty()) {
            throw new GradleException('MVVM 分层越界：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkNoBaselineCopies') {
    group = 'verification'
    description = 'Fail if app declares a type whose name already exists as a lib_common baseline type; baseline primitives have exactly one home.'
    doLast {
        // 结构规则：lib_common 声明的顶层类型是基线原语，app 侧出现同名顶层类型即视为复制了一份。
        // 判定只看包/类型结构，不认文件名或具体类名，所以新增基线类型不需要改这个门禁。
        Map<String, String> baseline = collectBaselineTypes('lib_common/src/main/java/com/yovo/lib_common')
        def offenders = []
        javaMainTree('src/main/java').each { File file ->
            def rel = appRelativePath(file)
            boolean untouched = untouchedFeatureRoots.any { rel.contains(it) }
            eachJavaLine(file) { f, line, number ->
                if (untouched) {
                    return
                }
                def matcher = line =~ declaredTopLevelType
                if (!matcher.find()) {
                    return
                }
                String typeName = matcher.group(1)
                String source = baseline.get(typeName)
                if (source != null) {
                    offenders << "${rel}:${number}: ${typeName} 与基线类型同名（${source}）；基线原语只能在 lib_common 对应包内单点实现"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('基线原语只能有一份（lib_common 对应包）：\n'
                    + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkAppDependencyBoundary', 'checkAppLayering', 'checkAiLayerImports',
            'checkComponentOwnership', 'checkExplicitImports', 'checkFrameworkToastForbidden',
            'checkSingleYoLogInit', 'checkAppMvvmLayers', 'checkNoBaselineCopies'
}
