plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.ggec.earbuds'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.ggec.earbuds'
        minSdk = 29
        targetSdk {
            version = release(37)
        }
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation project(':lib_common')
    implementation project(':lib_ai')
    implementation project(':biz_appupdate')
    implementation project(':biz_ggec_hs')

    implementation files('libs/youi_kit-1.0.0.aar')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // android.jar 里的 org.json 是抛异常的桩，数据层的 JSON 编解码测试需要真实实现。
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

tasks.register('checkShellLayerImports') {
    group = 'verification'
    description = 'Fail if shell UI, domain, or data cross their layer boundary.'
    doLast {
        def offenders = []
        def scan = { File file, List<String> forbidden ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            if (rel.endsWith('app/src/main/java/com/ggec/earbuds/wiring/ShellGraph.java')) {
                return
            }
            file.eachLine { line, index ->
                forbidden.each { token ->
                    if (line.contains(token)) {
                        offenders << "${rel}:${index}: ${line.trim()}"
                    }
                }
            }
        }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { file ->
            scan(file, ['com.ggec.earbuds.data'])
        }
        scan(project.file('src/main/java/com/ggec/earbuds/ui/shell/ShellViewModel.java'),
                ['android.view', 'android.widget', 'com.yohu.youi', 'com.ggec.earbuds.wiring'])
        fileTree(project.file('src/main/java/com/ggec/earbuds/domain')) {
            include '**/*.java'
        }.each { file ->
            scan(file, ['com.ggec.earbuds.data', 'com.ggec.earbuds.ui', 'android.', 'com.yohu.youi'])
        }
        fileTree(project.file('src/main/java/com/ggec/earbuds/data')) {
            include '**/*.java'
        }.each { file ->
            scan(file, ['com.ggec.earbuds.ui', 'android.', 'com.yohu.youi'])
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Shell layer boundary violated:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkAiLayerImports') {
    group = 'verification'
    description = 'Fail if the AI feature crosses its layer boundaries.'
    doLast {
        def offenders = []
        def scanTree = { String dir, String pattern, List<String> forbidden ->
            fileTree(project.file(dir)) {
                include pattern
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    forbidden.each { token ->
                        if (line.contains(token)) {
                            offenders << "${rel}:${index}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        def base = 'src/main/java/com/ggec/earbuds'
        // 领域层：纯 Java，不认识 lib_ai、JSON、Android、数据层与装配。
        scanTree("${base}/domain/ai", '**/*.java',
                ['com.yovo.lib_ai', 'org.json', 'com.ggec.earbuds.platform',
                 'com.ggec.earbuds.wiring', 'com.ggec.earbuds.data'])
        // 数据层：只通过端口和 lib_ai 说话，不碰界面、平台实现和装配，严禁依赖 lib_ai 内部实现或具体厂商包。
        scanTree("${base}/data/ai", '**/*.java',
                ['com.ggec.earbuds.platform', 'com.ggec.earbuds.wiring',
                 'com.yovo.lib_ai.internal', 'com.yovo.lib_ai.platform.openai',
                 'com.yovo.lib_ai.platform.qwen', 'com.yovo.lib_ai.platform.anthropic',
                 'com.yovo.lib_ai.platform.deepseek', 'com.yovo.lib_ai.platform.sensenova'])
        // 界面层：只依赖用例和领域模型，不直接拿仓库、网关或 lib_ai。
        scanTree("${base}/ui/ai", '**/*.java',
                ['com.yovo.lib_ai', 'org.json', 'com.ggec.earbuds.platform',
                 'domain.ai.port.AiSettingsRepository', 'domain.ai.port.AiConversationRepository',
                 'domain.ai.port.AiChatGateway', 'domain.ai.port.AiModelGateway',
                 'domain.ai.port.AiSpeedTestGateway', 'domain.ai.port.AiPlatformCatalog'])
        // ViewModel 不持有 Context，也不创建视图。
        scanTree("${base}/ui/ai", '**/*ViewModel.java',
                ['android.view', 'android.widget', 'android.content', 'android.app',
                 'com.yohu.youi', 'com.ggec.earbuds.wiring'])
        // 平台层：只放 Android 实现，不反向依赖界面。
        scanTree("${base}/platform", '**/*.java',
                ['com.ggec.earbuds.ui', 'com.yohu.youi', 'com.ggec.earbuds.wiring'])
        // 数据网关只做 I/O：模型筛选等业务策略必须留在领域，不允许网关反向依赖策略。
        scanTree("${base}/data/ai/gateway", '**/*.java',
                ['com.ggec.earbuds.domain.ai.policy'])
        if (!offenders.isEmpty()) {
            throw new GradleException('AI layer boundary violated:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkShellLayerImports', 'checkAiLayerImports'
}

tasks.register('checkMainThreadIoImports') {
    group = 'verification'
    description = 'Fail if UI or ViewModel code owns disk, JSON, or persistence implementations.'
    doLast {
        def offenders = []
        def forbidden = [
                'java.io.FileOutputStream',
                'java.io.FileDescriptor',
                'java.nio.file.Files',
                'org.json.',
                'FileAiDocumentStore',
                'AiSettingsRepositoryImpl',
                'AiConversationRepositoryImpl'
        ]
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                forbidden.each { token ->
                    if (line.contains(token)) {
                        offenders << "${rel}:${index}: ${line.trim()}"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('UI layer owns storage work:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkComponentOwnership') {
    group = 'verification'
    description = 'Fail if page code destroys YoUI components outside a release scope.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                def trimmed = line.trim()
                if ((trimmed.contains('YoList') || trimmed.contains('YoSelect')
                        || trimmed.contains('YoMenu') || trimmed.contains('YoDialog'))
                        && trimmed.matches('.*\\.destroy\\(\\);.*')) {
                    offenders << "${rel}:${index}: ${trimmed}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'YoUI component destroyed outside YoComponents/YoComponentScope:\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkMainThreadIoImports', 'checkComponentOwnership'
}

tasks.register('checkDeviceLayerImports') {
    group = 'verification'
    description = 'Fail if the device feature crosses its layer boundaries.'
    doLast {
        def offenders = []
        // allowed：行级白名单，命中这些字面量的行不做禁止项匹配（用于唯一被批准的适配器）。
        def scanTree = { String dir, String pattern, List<String> forbidden, List<String> allowed ->
            fileTree(project.file(dir)) {
                include pattern
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    if (allowed.any { String token -> line.contains(token) }) {
                        return
                    }
                    forbidden.each { token ->
                        if (line.contains(token)) {
                            offenders << "${rel}:${index}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        def base = 'src/main/java/com/ggec/earbuds'
        scanTree("${base}/domain/device", '**/*.java',
                ['com.ggec.earbuds.data', 'com.ggec.earbuds.ui', 'android.', 'com.yohu.youi'], [])
        scanTree("${base}/data/device", '**/*.java',
                ['com.ggec.earbuds.ui', 'android.', 'com.yohu.youi'], [])
        // 界面层只认领域模型与端口：数据层、以及 app 自己的 provider 适配包（蓝牙 / AI SDK 的落地处）
        // 都不许进来。唯一显式白名单是 PermissionProvider——它是唯一允许的权限适配器：
        // Android 运行时权限没有领域端口，申请与结果回传只由 ScanActivity 转发，决策仍在 VM。
        scanTree("${base}/ui/device", '**/*.java',
                ['com.ggec.earbuds.data', 'com.ggec.earbuds.provider.'],
                ['com.ggec.earbuds.provider.lib_common.PermissionProvider'])
        scanTree("${base}/ui/device", '**/*ViewModel.java',
                ['android.view', 'android.widget', 'android.content', 'android.app',
                 'com.yohu.youi', 'com.ggec.earbuds.wiring'], [])
        if (!offenders.isEmpty()) {
            throw new GradleException('Device layer boundary violated:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkDeviceLayerImports'
}

tasks.register('checkExplicitImports') {
    group = 'verification'
    description = 'Fail if a Java file uses a wildcard import.'
    doLast {
        def offenders = []
        ['src/main/java', 'src/test/java', 'src/androidTest/java'].each { String dir ->
            def root = project.file(dir)
            if (!root.exists()) {
                return
            }
            fileTree(root) {
                include '**/*.java'
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    if (line.trim().matches('import\\s+(static\\s+)?[\\w.]+\\.\\*;')) {
                        offenders << "${rel}:${index}: ${line.trim()}"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Wildcard import is not allowed:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkExplicitImports'
}

tasks.register('checkFrameworkToastForbidden') {
    group = 'verification'
    description = 'Fail if any Java code uses android.widget.Toast instead of YoUI YoToast.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                if (line.contains('android.widget.Toast')) {
                    offenders << "${rel}:${index}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Direct android.widget.Toast usage is forbidden. Use YoToast from YoUI instead:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkFrameworkToastForbidden'
}

tasks.register('checkSingleYoLogInit') {
    group = 'verification'
    description = 'Only YoLogBootstrap may call YoLog.init; App must initialize YoLog via provider.'
    doLast {
        def offenders = []
        def bootstrapPath = '/lib_common/src/main/java/com/yovo/lib_common/log/YoLogBootstrap.java'
        fileTree(project.rootDir) {
            include '**/*.java'
            exclude '**/build/**'
            exclude '**/.gradle/**'
            exclude '**/src/test/**'
            exclude '**/src/androidTest/**'
        }.each { file ->
            def abs = file.absolutePath.replace('\\', '/')
            if (abs.endsWith(bootstrapPath)) {
                return
            }
            def rel = project.rootDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            file.eachLine { line, index ->
                if (line =~ /\bYoLog\s*\.\s*init\s*\(/) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'Direct YoLog.init is forbidden (use YoLogBootstrap.initOnce/ensureInitialized):\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkSingleYoLogInit'
}

tasks.register('checkAppSdkProviderBoundary') {
    group = 'verification'
    description = 'Only provider/** may import bluetooth/ai/lib_common/biz SDKs (incremental).'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/*.java'
        }.each { file ->
            def rel = project.rootDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            if (rel.contains('/provider/')) {
                return
            }
            file.eachLine { line, index ->
                def businessSdk = line =~ /^\s*import\s+com\.yovo\.(lib_bluetooth|lib_ai|biz_ggec_hs)\./
                def libCommonCapability = (line =~ /^\s*import\s+com\.yovo\.lib_common\./) \
                        && !(line =~ /^\s*import\s+com\.yovo\.lib_common\.event\./)
                if (businessSdk || libCommonCapability) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        fileTree(project.file('src')) {
            include 'main/java/**/*.java'
            include 'test/java/**/*.java'
        }.each { file ->
            def rel = project.rootDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            file.eachLine { line, index ->
                if (line =~ /^\s*import\s+com\.yovo\.lib_bluetooth\./) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'App 不直接依赖 lib_bluetooth。非 provider 只通过本模块端口，provider 只调用 biz_ggec_hs 公开接口:\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkAppSdkProviderBoundary'
}

tasks.register('checkAppMvvmLayers') {
    group = 'verification'
    description = 'Strict MVVM layering: VM no android UI; domain no android/data/ui; ui no data; data no ui.'
    doLast {
        def offenders = []
        def rel = { File f -> project.rootDir.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*ViewModel.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+android\.(view|widget|content|app)\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/domain')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+(android\.|com\.ggec\.earbuds\.(data|ui)\.)/) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+com\.ggec\.earbuds\.data\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/data')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+com\.ggec\.earbuds\.ui\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        if (!offenders.isEmpty()) {
            throw new GradleException('MVVM layer violation:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkAppMvvmLayers'
}
