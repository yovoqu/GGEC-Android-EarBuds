plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.ggec.earbuds'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.ggec.earbuds'
        minSdk = 29
        targetSdk {
            version = release(37)
        }
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation project(':lib_common')
    implementation project(':lib_ai')
    implementation project(':biz_appupdate')
    implementation project(':biz_ggec_hs')

    implementation files('libs/youi_kit-1.0.0.aar')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // android.jar 里的 org.json 是抛异常的桩，数据层的 JSON 编解码测试需要真实实现。
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// ---------------------------------------------------------------------------
// 边界门禁：全部按「目录 + 包名」判定，不含人名 / 类名白名单（design.md §8、§1.2）。
// ---------------------------------------------------------------------------

// 本模块依赖的业务能力模块：只有 provider/<dependency> 可以直接 import。
def providerDependencyModules = ['lib_ai', 'lib_common', 'biz_ggec_hs', 'biz_appupdate']

// 平台基线（design.md §1.2 R6）：按依赖分类放行，不是文件名白名单。
// 事件槽这类共享 UI 原语等价于 androidx 基线，任何 ui 类可用；业务能力域仍必须走 provider。
def platformBaselinePackages = ['com.yovo.lib_common.event']

def appRelativePath = { File file ->
    rootProject.relativePath(file).replace('\\', '/')
}

def appProviderPath = { File file ->
    def rel = appRelativePath(file)
    def marker = '/provider/'
    int index = rel.indexOf(marker)
    index < 0 ? null : rel.substring(index + marker.length())
}

tasks.register('checkAppDependencyBoundary') {
    group = 'verification'
    description = 'src/main/java only: provider/<dependency> is the single import point, and its directory must equal that module. Test source sets are excluded because their job is reaching the object under test and its stubs, not mirroring production boundaries.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/*.java'
        }.each { File file ->
            def rel = appRelativePath(file)
            def providerPath = appProviderPath(file)
            def providerModule = providerPath == null ? null : providerPath.split('/')[0]
            file.eachLine { line, index ->
                def matcher = line =~ /^\s*import\s+(?:static\s+)?(com\.yovo\.[\w.]+);/
                if (!matcher.find()) {
                    return
                }
                def imported = matcher.group(1)
                if (providerModule == null) {
                    if (platformBaselinePackages.any { String baseline -> imported.startsWith(baseline + '.') }) {
                        return
                    }
                    def module = providerDependencyModules.find { String name ->
                        imported.startsWith("com.yovo.${name}.")
                    }
                    if (module != null) {
                        offenders << "${rel}:${index + 1}: ${line.trim()}"
                    }
                    return
                }
                // provider/<dependency> 内只允许 import 对应依赖模块，不得跨依赖混用。
                if (!imported.startsWith("com.yovo.${providerModule}.")) {
                    offenders << "${rel}:${index + 1}: provider/${providerModule} 只能 import com.yovo.${providerModule}.* -> ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'App 依赖只能经 provider/<dependency> 单点接入：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkAppLayering') {
    group = 'verification'
    description = 'src/main/java only: ui/data/domain must not reach provider, provider is referenced only from wiring, and a ViewModel owns no platform views. Test source sets are out of scope: they must be able to reach the object under test and its stubs.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/*.java'
        }.each { File file ->
            def rel = appRelativePath(file)
            def isViewModel = file.name.endsWith('ViewModel.java')
            file.eachLine { line, index ->
                def matcher = line =~ /^\s*import\s+(?:static\s+)?([\w.]+);/
                if (!matcher.find()) {
                    return
                }
                def imported = matcher.group(1)
                def at = { String message -> offenders << "${rel}:${index + 1}: ${message} -> ${line.trim()}" }
                // ui / data / domain 到 data / ui / android 的禁止项由 checkAppMvvmLayers 单点负责，
                // 本任务只补它不覆盖的结构性规则。
                if (rel.contains('/ui/') && imported.startsWith('com.ggec.earbuds.provider.')) {
                    at('ui 不得 import provider.**')
                }
                if (rel.contains('/data/')) {
                    if (imported.startsWith('com.ggec.earbuds.provider.')) {
                        at('data 不得 import provider.**')
                    }
                    if (imported.startsWith('android.')) {
                        at('data 不得 import android.*')
                    }
                }
                if (rel.contains('/domain/')) {
                    if (imported.startsWith('com.ggec.earbuds.provider.')) {
                        at('domain 不得 import provider.**')
                    }
                    if (imported == 'org.json.JSONObject' || imported.startsWith('org.json.')) {
                        at('domain 不得 import org.json（持久化只在 data）')
                    }
                }
                if (rel.contains('/ui/')) {
                    if (imported == 'java.io.File' || imported == 'java.io.FileOutputStream'
                            || imported == 'java.nio.file.Files') {
                        at('ui 不得直接做文件 IO（台账/档案只在 data）')
                    }
                }
                // §1.2 R2：provider/** 只被本模块装配根（wiring/**）引用。
                if (imported.startsWith('com.ggec.earbuds.provider.')
                        && !rel.contains('/wiring/') && !rel.contains('/provider/')) {
                    at('provider.** 只允许装配根 wiring/** 引用')
                }
                if (isViewModel) {
                    if (imported.startsWith('com.yohu.youi.')) {
                        at('ViewModel 不得 import YoUI 组件')
                    }
                    if (imported.startsWith('com.ggec.earbuds.wiring.')) {
                        at('ViewModel 不得 import 装配根')
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('App 分层越界：\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkAiLayerImports') {
    group = 'verification'
    description = 'Fail if the AI feature crosses its layer boundaries.'
    doLast {
        def offenders = []
        def scanTree = { String dir, String pattern, List<String> forbidden ->
            fileTree(project.file(dir)) {
                include pattern
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    forbidden.each { token ->
                        if (line.contains(token)) {
                            offenders << "${rel}:${index}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        def base = 'src/main/java/com/ggec/earbuds'
        // 领域层：纯 Java，不认识 lib_ai、JSON、Android、数据层与装配。
        scanTree("${base}/domain/ai", '**/*.java',
                ['com.yovo.lib_ai', 'org.json', 'com.ggec.earbuds.platform',
                 'com.ggec.earbuds.wiring', 'com.ggec.earbuds.data'])
        // 数据层：只通过端口和 lib_ai 说话，不碰界面、平台实现和装配，严禁依赖 lib_ai 内部实现或具体厂商包。
        scanTree("${base}/data/ai", '**/*.java',
                ['com.ggec.earbuds.platform', 'com.ggec.earbuds.wiring',
                 'com.yovo.lib_ai.internal', 'com.yovo.lib_ai.platform.openai',
                 'com.yovo.lib_ai.platform.qwen', 'com.yovo.lib_ai.platform.anthropic',
                 'com.yovo.lib_ai.platform.deepseek', 'com.yovo.lib_ai.platform.sensenova'])
        // 界面层：只依赖用例和领域模型，不直接拿仓库、网关或 lib_ai。
        scanTree("${base}/ui/ai", '**/*.java',
                ['com.yovo.lib_ai', 'org.json', 'com.ggec.earbuds.platform',
                 'domain.ai.port.AiSettingsRepository', 'domain.ai.port.AiConversationRepository',
                 'domain.ai.port.AiChatGateway', 'domain.ai.port.AiModelGateway',
                 'domain.ai.port.AiSpeedTestGateway', 'domain.ai.port.AiPlatformCatalog'])
        // ViewModel 不持有 Context，也不创建视图。
        scanTree("${base}/ui/ai", '**/*ViewModel.java',
                ['android.view', 'android.widget', 'android.content', 'android.app',
                 'com.yohu.youi', 'com.ggec.earbuds.wiring'])
        // 平台层：只放 Android 实现，不反向依赖界面。
        scanTree("${base}/platform", '**/*.java',
                ['com.ggec.earbuds.ui', 'com.yohu.youi', 'com.ggec.earbuds.wiring'])
        // 数据层只做 I/O：模型筛选等业务策略必须留在领域，不允许数据层反向依赖策略。
        scanTree("${base}/data/ai", '**/*.java',
                ['com.ggec.earbuds.domain.ai.policy'])
        // 网关同样只做 I/O：策略（默认值、筛选、校验）不得下沉进 provider，也不得反向依赖界面。
        scanTree("${base}/provider/lib_ai", '**/*.java',
                ['com.ggec.earbuds.domain.ai.policy', 'com.ggec.earbuds.ui', 'com.ggec.earbuds.wiring'])
        // 设备台账编解码：只允许共享 JSON 原语与设备领域模型，不得伸进 ui/provider/AI。
        fileTree(project.file("${base}/data/device/json")) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                def matcher = line =~ /^\s*import\s+([\w.]+);/
                if (!matcher.find()) {
                    return
                }
                def imported = matcher.group(1)
                if (imported.startsWith('com.ggec.earbuds.')
                        && !imported.startsWith('com.ggec.earbuds.data.json.')
                        && !imported.startsWith('com.ggec.earbuds.domain.device.')) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('AI layer boundary violated:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkMainThreadIoImports') {
    group = 'verification'
    description = 'Fail if UI or ViewModel code owns disk, JSON, or persistence implementations.'
    doLast {
        def offenders = []
        def forbidden = [
                'java.io.FileOutputStream',
                'java.io.FileDescriptor',
                'java.nio.file.Files',
                'org.json.',
                'FileAiDocumentStore',
                'AiSettingsRepositoryImpl',
                'AiConversationRepositoryImpl'
        ]
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                forbidden.each { token ->
                    if (line.contains(token)) {
                        offenders << "${rel}:${index}: ${line.trim()}"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('UI layer owns storage work:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkComponentOwnership') {
    group = 'verification'
    description = 'Fail if page code destroys YoUI components outside a release scope.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                def trimmed = line.trim()
                if ((trimmed.contains('YoList') || trimmed.contains('YoSelect')
                        || trimmed.contains('YoMenu') || trimmed.contains('YoDialog'))
                        && trimmed.matches('.*\\.destroy\\(\\);.*')) {
                    offenders << "${rel}:${index}: ${trimmed}"
                }
                // 弹窗原语只有一套：YoUI 的 YoDialog/YoMenu。框架 AlertDialog 不在页面层出现。
                if (trimmed.contains('androidx.appcompat.app.AlertDialog')) {
                    offenders << "${rel}:${index}: ${trimmed}"
                }
                // 方法引用也是释放通道：未登记到 own(...)/releases.add(...) 的 ::destroy 一律视为漏管。
                if (trimmed.contains('::destroy')
                        && !trimmed.contains('own(') && !trimmed.contains('releases.add(')) {
                    offenders << "${rel}:${index}: ${trimmed}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'YoUI 组件只能经 YoComponents/YoComponentScope 释放，弹窗只用 YoDialog/YoMenu：\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.register('checkExplicitImports') {
    group = 'verification'
    description = 'Fail if a Java file uses a wildcard import.'
    doLast {
        def offenders = []
        ['src/main/java', 'src/test/java', 'src/androidTest/java'].each { String dir ->
            def root = project.file(dir)
            if (!root.exists()) {
                return
            }
            fileTree(root) {
                include '**/*.java'
            }.each { File file ->
                def rel = rootProject.relativePath(file).replace('\\', '/')
                file.eachLine { line, index ->
                    if (line.trim().matches('import\\s+(static\\s+)?[\\w.]+\\.\\*;')) {
                        offenders << "${rel}:${index}: ${line.trim()}"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Wildcard import is not allowed:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkFrameworkToastForbidden') {
    group = 'verification'
    description = 'Fail if any Java code uses android.widget.Toast instead of YoUI YoToast.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/*.java'
        }.each { File file ->
            def rel = rootProject.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                if (line.contains('android.widget.Toast')) {
                    offenders << "${rel}:${index}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Direct android.widget.Toast usage is forbidden. Use YoToast from YoUI instead:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkSingleYoLogInit') {
    group = 'verification'
    description = 'Only YoLogBootstrap may call YoLog.init; App must initialize YoLog via provider.'
    doLast {
        def offenders = []
        def bootstrapPath = '/lib_common/src/main/java/com/yovo/lib_common/log/YoLogBootstrap.java'
        fileTree(project.rootDir) {
            include '**/*.java'
            exclude '**/build/**'
            exclude '**/.gradle/**'
            exclude '**/src/test/**'
            exclude '**/src/androidTest/**'
        }.each { file ->
            def abs = file.absolutePath.replace('\\', '/')
            if (abs.endsWith(bootstrapPath)) {
                return
            }
            def rel = project.rootDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            file.eachLine { line, index ->
                if (line =~ /\bYoLog\s*\.\s*init\s*\(/) {
                    offenders << "${rel}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'Direct YoLog.init is forbidden (use YoLogBootstrap.initOnce/ensureInitialized):\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.register('checkAppMvvmLayers') {
    group = 'verification'
    description = 'Strict MVVM layering: VM no android UI; domain no android/data/ui; ui no data; data no ui.'
    doLast {
        def offenders = []
        def rel = { File f -> project.rootDir.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*ViewModel.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+android\.(view|widget|content|app)\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            }
            // 主线程定时器是平台能力：ViewModel 只持 Ticker 抽象，Handler/Looper 由 wiring 注入。
            if (l =~ /^\s*import\s+android\.os\.(Handler|Looper)\s*;/) {
                offenders << "${rel(f)}:${i + 1}: VM 不得自建 Handler/Looper：${l.trim()}"
            }
            // 仓库端口是 usecase 的依赖：ViewModel 只能经 usecase 触达领域能力。
            if (l =~ /^\s*import\s+com\.ggec\.earbuds\.domain\.[\w.]*\.port\.\w*Repository\s*;/) {
                offenders << "${rel(f)}:${i + 1}: VM 不得直连仓库端口：${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/domain')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+(android\.|com\.ggec\.earbuds\.(data|ui)\.)/) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/ui')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+com\.ggec\.earbuds\.data\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        fileTree(project.file('src/main/java/com/ggec/earbuds/data')) {
            include '**/*.java'
        }.each { f -> f.eachLine { l, i ->
            if (l =~ /^\s*import\s+com\.ggec\.earbuds\.ui\./) {
                offenders << "${rel(f)}:${i + 1}: ${l.trim()}"
            } } }
        if (!offenders.isEmpty()) {
            throw new GradleException('MVVM layer violation:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkNoBaselineCopies') {
    group = 'verification'
    description = 'Fail if app re-implements a lib_common baseline type; the event slot has exactly one source.'
    doLast {
        def offenders = []
        fileTree(project.file('src/main/java')) {
            include '**/OneShotLiveData.java'
        }.each { File file ->
            offenders << appRelativePath(file)
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    '基线原语只能有一份（com.yovo.lib_common.event）：\n' + offenders.join('\n'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkAppDependencyBoundary', 'checkAppLayering', 'checkAiLayerImports',
            'checkMainThreadIoImports', 'checkComponentOwnership', 'checkExplicitImports',
            'checkFrameworkToastForbidden', 'checkSingleYoLogInit', 'checkAppMvvmLayers',
            'checkNoBaselineCopies'
}
