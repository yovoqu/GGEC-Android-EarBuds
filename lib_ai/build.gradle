plugins {
    id 'com.android.library'
}

android {
    namespace 'com.yovo.lib_ai'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation project(':lib_common')
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.json:json:20240303'
}

tasks.withType(Test).configureEach {
    // android.jar 里的 org.json 是抛异常的桩。单元测试改用 Maven 上的实现。
    classpath = classpath.filter { file ->
        def name = file.name
        name != 'android.jar' && !name.startsWith('mockable-android')
    }
}

def publicRoots = [
        'src/main/java/com/yovo/lib_ai/api/',
        'src/main/java/com/yovo/lib_ai/error/',
        'src/main/java/com/yovo/lib_ai/chat/',
        'src/main/java/com/yovo/lib_ai/responses/',
        'src/main/java/com/yovo/lib_ai/messages/',
        'src/main/java/com/yovo/lib_ai/platform/',
        'src/main/java/com/yovo/lib_ai/catalog/',
        'src/main/java/com/yovo/lib_ai/models/',
        'src/main/java/com/yovo/lib_ai/completion/',
        'src/main/java/com/yovo/lib_ai/probe/',
        'src/main/java/com/yovo/lib_ai/params/',
        'src/main/java/com/yovo/lib_ai/usage/',
        'src/main/java/com/yovo/lib_ai/realtime/',
        'src/main/java/com/yovo/lib_ai/speech/'
]

tasks.register('checkLibAiPublicBoundary') {
    group = 'verification'
    description = 'Fail if public lib_ai types depend on internal packages or OkHttp.'
    doLast {
        def offenders = []
        publicRoots.each { root ->
            fileTree(project.projectDir) {
                include "${root}**/*.java"
            }.each { file ->
                def rel = project.relativePath(file).replace('\\', '/')
                def publicType = false
                def hits = []
                file.eachLine { line, index ->
                    if (line =~ /^\s*public\s+(?:(?:final|abstract|sealed)\s+)*(?:class|interface|enum|record)\s/) {
                        publicType = true
                    }
                    if (line =~ /^\s*import\s+(com\.yovo\.lib_ai\.internal\.|okhttp3\.|okio\.)/) {
                        hits << "${rel}:${index}: ${line.trim()}"
                    }
                }
                if (publicType) {
                    offenders.addAll(hits)
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'lib_ai public types must not import internal, OkHttp, or Okio:\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.register('checkLibAiLogSeam') {
    group = 'verification'
    description = 'Only YoAiLogger may import lib_common.log (single logging seam).'
    doLast {
        def offenders = []
        fileTree(project.projectDir) {
            include 'src/main/java/**/*.java'
            exclude 'src/main/java/com/yovo/lib_ai/internal/common/diagnostics/YoAiLogger.java'
        }.each { file ->
            def rel = project.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                if (line =~ /^\s*import\s+com\.yovo\.lib_common\.log\./) {
                    offenders << "${rel}:${index}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Only YoAiLogger may import lib_common.log:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkLibAiProviderBoundary') {
    group = 'verification'
    description = 'Non-provider/YoAiLogger code must not import lib_common.'
    doLast {
        def offenders = []
        fileTree(project.projectDir) {
            include 'src/main/java/**/*.java'
            exclude 'src/main/java/com/yovo/lib_ai/provider/lib_common/**'
            exclude 'src/main/java/com/yovo/lib_ai/internal/common/diagnostics/YoAiLogger.java'
        }.each { file ->
            def rel = project.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                if (line =~ /^\s*import\s+com\.yovo\.lib_common\./) {
                    offenders << "${rel}:${index}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('lib_ai 非 provider/YoAiLogger 代码禁止 import lib_common:\n' + offenders.join('\n'))
        }
    }
}

tasks.register('checkNoStrayLogging') {
    group = 'verification'
    description = 'Fail on android.util.Log / System.out/err / printStackTrace / direct YoLog outside YoAiLogger.'
    doLast {
        def offenders = []
        def seam = 'com/yovo/lib_ai/internal/common/diagnostics/YoAiLogger.java'
        fileTree(project.projectDir) {
            include 'src/main/java/**/*.java'
        }.each { file ->
            def rel = project.relativePath(file).replace('\\', '/')
            file.eachLine { line, index ->
                def trimmed = line.trim()
                if (trimmed.contains('import android.util.Log')
                        || trimmed.contains('System.out')
                        || trimmed.contains('System.err')
                        || trimmed.contains('printStackTrace')) {
                    offenders << "${rel}:${index}: ${trimmed}"
                }
                if (!rel.endsWith(seam) && (trimmed =~ /\bYoLog\s*\./)) {
                    offenders << "${rel}:${index}: direct YoLog outside YoAiLogger: ${trimmed}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Stray logging detected:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkLibAiPublicBoundary',
            'checkLibAiLogSeam',
            'checkLibAiProviderBoundary',
            'checkNoStrayLogging'
}
