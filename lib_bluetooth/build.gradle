plugins {
    id 'com.android.library'
}

android {
    namespace 'com.yovo.lib_bluetooth'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':lib_common')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register('checkLibBluetoothProviderBoundary') {
    group = 'verification'
    description = 'Fail if non-provider code imports lib_common directly.'
    doLast {
        def offenders = []
        fileTree(project.projectDir) {
            include 'src/main/java/**/*.java'
            exclude 'src/main/java/com/yovo/lib_bluetooth/provider/lib_common/**'
        }.each { file ->
            file.text.eachLine { line, index ->
                if (line =~ /^\s*import\s+com\.yovo\.lib_common\./) {
                    offenders << "${file}:${index}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'lib_bluetooth 非 provider 代码禁止直接 import lib_common:\n'
                            + offenders.join('\n'))
        }
    }
}

tasks.register('checkLibBluetoothApiSurface') {
    group = 'verification'
    description = 'Fail if lib_bluetooth exposes more than YoCbtClient / YoBleClient API files.'
    doLast {
        def apiFiles = fileTree("${project.projectDir}/src/main/java/com/yovo/lib_bluetooth/api") {
            include '*.java'
        }.files.collect { it.name }.sort()
        def expected = ['YoBleClient.java', 'YoCbtClient.java']
        if (apiFiles != expected) {
            throw new GradleException(
                    'lib_bluetooth api 目录必须只包含两个门面文件，当前: ' + apiFiles.join(', '))
        }
        def apiOffenders = []
        fileTree("${project.projectDir}/src/main/java/com/yovo/lib_bluetooth/api") {
            include '*.java'
        }.each { file ->
            file.text.eachLine { line, index ->
                if (line =~ /^\s*import\s+com\.yovo\.lib_bluetooth\.internal\./) {
                    apiOffenders << "${file}:${index}: ${line.trim()}"
                }
            }
        }
        if (!apiOffenders.isEmpty()) {
            throw new GradleException(
                    'lib_bluetooth api 禁止 import internal:\n' + apiOffenders.join('\n'))
        }
        def rootFiles = fileTree("${project.projectDir}/src/main/java/com/yovo/lib_bluetooth") {
            include '*.java'
        }.files.collect { it.name }.sort()
        if (rootFiles != ['YoBluetoothSDK.java']) {
            throw new GradleException(
                    'lib_bluetooth 根包只允许 YoBluetoothSDK.java，当前: ' + rootFiles.join(', '))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkLibBluetoothProviderBoundary', 'checkLibBluetoothApiSurface'
}
